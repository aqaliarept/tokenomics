[project]
name = "tokenomics"
version = "0.1.0"
description = "Tokenomics cooperative multi-agent RL environment (Python port of the Go emulator)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pettingzoo>=1.24",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = ["supersuit>=3.9", "torch>=2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tokenomics*"]

# Runtime JSON resources loaded by Path(__file__) (env DEFAULT_CONFIG and the shipped
# held-out manifest + its base) must ship in the wheel/sdist, else they are missing
# from a non-source install and loading raises FileNotFoundError.
[tool.setuptools.package-data]
tokenomics = ["config/*.json", "eval/manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
