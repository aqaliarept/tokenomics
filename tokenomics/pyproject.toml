[project]
name = "tokenomics"
version = "0.1.0"
description = "Tokenomics cooperative multi-agent RL environment"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pettingzoo>=1.24",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
train = ["supersuit>=3.9", "torch>=2.2"]
# the input-output ceiling B_lp (eval/ceiling_bound.py, task 4.7): HiGHS via scipy; only the
# atlas bound needs it, so it stays out of the core dependencies
lp = ["scipy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tokenomics*"]

# Runtime JSON resources loaded by Path(__file__) (env DEFAULT_CONFIG and the shipped
# held-out manifest + its base, the gate registry files) must ship in the wheel/sdist, else they are missing
# from a non-source install and loading raises FileNotFoundError.
[tool.setuptools.package-data]
tokenomics = ["config/*.json", "eval/manifests/*.json", "eval/registry/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Champion regression gate (EXP-0006B) runs a ~13-min full eval — deselect it from the
# default fast suite; opt in with `pytest -m champion` (CLI -m overrides this).
addopts = "-m 'not champion'"
markers = [
    "champion: slow full-eval regression gate for the shipped orderer champion (opt-in)",
]
